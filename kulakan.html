<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>KULAKAN — Kasir, stok, dan catatan utang</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#252525;background:#f2f2f2;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}.phone{max-width:400px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 22px #0001}.status{height:29px;padding:7px 20px;font-size:12px;background:#eee;display:flex;justify-content:space-between}.top{padding:12px 20px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:23px;font-weight:400;margin:0 0 3px}.sub{color:#686868;font-size:14px}.icon{border:0;background:transparent;font-size:23px;padding:8px;cursor:pointer;color:#222}.content{padding:16px 20px 26px;flex:1;overflow:auto}.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #bbb;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;position:sticky;bottom:0}.nav button{border:0;background:transparent;color:#333;border-radius:8px;padding:8px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer}.nav button.active{background:#e7e7e7;font-weight:bold}.nav .ico{font-size:22px;line-height:22px}.title{font-size:20px;margin:2px 0 12px;font-weight:400}.muted{color:#686868}.card{background:#f2f2f2;border:1px solid #ddd;border-radius:9px;padding:15px;margin:12px 0}.metric{font-size:32px;font-weight:700;margin:6px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row + .row{margin-top:8px}.button{width:100%;min-height:48px;border-radius:7px;padding:10px 12px;border:1px solid #252525;background:#252525;color:white;font-size:15px;font-weight:600;cursor:pointer}.button.light{background:#fff;color:#252525}.button.gray{background:#e7e7e7;color:#252525;border-color:#aaa}.button.small{width:auto;min-height:38px;padding:7px 11px}.button:active{transform:scale(.99)}.actions{display:flex;gap:9px;margin:12px 0}.actions>*{flex:1}.input{width:100%;height:48px;border:1px solid #bbb;border-radius:7px;padding:0 12px;font:inherit;background:#fff;color:#222}.label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}.segmented{display:grid;gap:7px;margin:12px 0}.segmented.two{grid-template-columns:repeat(2,1fr)}.segmented.three{grid-template-columns:repeat(3,1fr)}.segmented button{height:44px;border:1px solid #bbb;border-radius:7px;background:white;font:inherit;color:#222;cursor:pointer}.segmented button.active{background:#e5e5e5;border-color:#252525}.info{background:#f2f2f2;border-radius:8px;padding:12px;line-height:1.4;margin:12px 0}.list-row{padding:12px 0;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;gap:10px}.list-row:last-child{border-bottom:0}.list-row h3{font-size:16px;margin:0 0 4px}.list-row p{font-size:13px;color:#686868;margin:0}.qty{display:flex;align-items:center;border:1px solid #bbb;border-radius:7px}.qty button{border:0;background:transparent;font-size:18px;width:34px;height:35px;cursor:pointer}.qty span{min-width:30px;text-align:center}.toolbar{display:flex;gap:9px}.toolbar .input{flex:1}.bottom-space{height:6px}.login{padding-top:8px}.login-brand{font-size:28px;letter-spacing:1px;margin:22px 0 2px}.login-welcome{font-size:28px;line-height:1.15;font-weight:400;margin:50px 0 12px}.login-copy{color:#686868;font-size:17px;line-height:1.4;margin:0 0 32px}.secure{margin-top:14px}.center{text-align:center}.modal-back{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:5}.modal{background:white;border-radius:12px;padding:20px;width:min(360px,100%);box-shadow:0 8px 40px #0003}.modal h2{font-size:20px;font-weight:500;margin:0 0 12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;border-radius:8px;padding:12px 16px;font-size:14px;z-index:9;max-width:90%;text-align:center;box-shadow:0 3px 16px #0003}.chart{height:130px;display:flex;justify-content:space-around;align-items:end;padding-top:10px}.bar{width:30px;background:#e1e1e1;position:relative}.bar.today{background:#252525}.bar small{position:absolute;bottom:-20px;left:0;width:100%;text-align:center;color:#686868}.hide{display:none!important}@media(min-width:700px){body{padding:20px 0}.phone{min-height:calc(100dvh - 40px);border:1px solid #ddd;border-radius:10px;overflow:hidden}.content{max-height:calc(100dvh - 130px)}}
  </style>
  <style>.debt-item{width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border-top:0;border-left:0;border-right:0;cursor:pointer}</style>
</head>
<body>
<main class="phone" id="app" aria-live="polite"></main>
<script>
(() => {
  const initial = {
    products:[
      {name:'Beras medium',price:14000,unit:'kg',stock:18,bulk:true,favorite:true,min:5},
      {name:'Gula pasir',price:15000,unit:'kg',stock:10,bulk:true,favorite:true,min:5},
      {name:'Minyak goreng',price:18000,unit:'botol',stock:3,bulk:false,favorite:false,min:5},
      {name:'Mi instan',price:3500,unit:'bungkus',stock:8,bulk:false,favorite:false,min:10},
      {name:'Telur ayam',price:28000,unit:'kg',stock:12,bulk:true,favorite:false,min:4},
      {name:'Kopi sachet',price:2000,unit:'sachet',stock:35,bulk:false,favorite:false,min:8}
    ],
    debts:[
      {name:'Bu Siti',phone:'08xx xxxx 2233',balance:125000,due:'Hari ini'},
      {name:'Pak Budi',phone:'08xx xxxx 3344',balance:85000,due:'7 hari lagi'},
      {name:'Bu Rina',phone:'08xx xxxx 4455',balance:75000,due:'4 hari lagi'},
      {name:'Pak Agus',phone:'08xx xxxx 5566',balance:40000,due:'6 hari lagi'}
    ],cart:{},sales:486000,transactions:12,tab:'home',screen:'login',filter:'Favorit',stockFilter:'Semua',debtFilter:'Belum lunas',payment:'Tunai',cash:50000,search:''
  };
  let state;
  try { state={...initial,...JSON.parse(localStorage.getItem('kulakan-demo')||'{}')}; } catch { state={...initial}; }
  state.products=initial.products.map((p,i)=>({...p,...(state.products?.[i]||{})}));
  state.debts=state.debts||initial.debts; state.cart=state.cart||{}; state.tab='home'; state.screen='login';
  const app=document.getElementById('app');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>'Rp'+Math.round(Number(n)||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  const total=()=>Object.entries(state.cart).reduce((s,[i,q])=>s+state.products[Number(i)].price*q,0);
  const persist=()=>{localStorage.setItem('kulakan-demo',JSON.stringify(state));};
  const status=()=>'<div class="status"><span>09.41</span><span>▮▮　◉　▰</span></div>';
  const head=(title,sub='')=>`<header class="top"><div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div><button class="icon" data-action="settings" aria-label="Pengaturan">⚙</button></header>`;
  const btn=(label,action,kind='')=>`<button class="button ${kind}" data-action="${action}">${label}</button>`;
  const info=(text,icon='ⓘ')=>`<div class="info"><b>${icon}</b>　${text}</div>`;
  const nav=()=>`<nav class="nav">${[['home','⌂','Beranda'],['cashier','▱','Kasir'],['stock','⬡','Stok'],['debts','▤','Utang'],['report','▥','Laporan']].map(([id,ico,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav>`;
  const header=()=>status()+head(state.tab==='home'?'Warung Adzqia':({cashier:'Kasir',stock:'Stok produk',debts:'Utang pelanggan',report:'Laporan toko',settings:'Pengaturan toko'}[state.tab]||'KULAKAN'),state.tab==='home'?'Sabtu, 24 Oktober 2026':({cashier:'Transaksi baru · Pelanggan umum',stock:`${state.products.length} produk · Satuan sesuai barang`,debts:'Catatan piutang Warung Berkah',report:'Diperbarui 24 Okt 2026 · 09.41'}[state.tab]||''));
  function login(){return `${status()}<section class="content login"><div class="login-brand">KULAKAN</div><div class="sub">Kasir, stok, dan catatan utang</div><hr style="border:0;border-top:1px solid #ddd;margin:22px -20px"><h1 class="login-welcome">Selamat datang, Bu Mariana</h1><p class="login-copy">Masuk untuk mulai melayani pelanggan di Warung Adzqia.</p><label class="label">Nomor HP pemilik</label><input class="input" value="08xx xxxx xxxx" aria-label="Nomor HP pemilik"><label class="label">Kata sandi</label><input class="input" type="password" value="kulakan" aria-label="Kata sandi"><p style="text-align:right"><a href="#" data-action="forgot">Lupa kata sandi?</a></p>${btn('Masuk ke toko','login')} ${info('Hanya pemilik yang dapat masuk. Jangan bagikan kata sandi toko Anda.','♙')}<p class="center muted" style="margin-top:36px">Baru menggunakan KULAKAN?</p>${btn('Daftarkan toko','register','light')}<p class="center muted">Data toko tersimpan di perangkat. Cadangkan secara berkala agar tetap aman.</p></section>`;}
  function home(){return `<section class="content"><p>Selamat pagi, Bu Mariana.</p><div class="card"><div>Penjualan hari ini</div><div class="metric">${money(state.sales)}</div><div class="row muted"><span>${state.transactions} transaksi</span><b style="color:#222">Laba Rp108.000</b></div><div class="row" style="margin-top:14px"><span class="muted">Tunai<br><b style="color:#222">Rp401.000</b></span><span class="muted">Utang baru<br><b style="color:#222">Rp85.000</b></span></div></div>${btn('Mulai transaksi kasir','goto-cashier')}<h2 class="title" style="margin-top:18px">Akses cepat</h2><div class="actions">${btn('Stok masuk','adjust-stock','light')}${btn('Catat cicilan','installment','light')}</div>${info('2 produk menipis · Minyak goreng dan Mi instan. Periksa stok sebelum belanja.','⚠')}<div class="row"><h2 class="title">Pengingat utang</h2><button class="icon" data-tab="debts">Lihat semua →</button></div>${debtRow(state.debts[0])}<div class="row" style="margin-top:14px"><h2 class="title">Transaksi terakhir</h2><span class="muted">Riwayat →</span></div><div class="list-row"><div><h3>#TRX-241026-012</h3><p>09.41 · 2 jenis produk · Tunai</p></div><b>${money(43000)}</b></div></section>`;}
  function productRows(){let q=state.search.toLowerCase();return state.products.map((p,i)=>({p,i})).filter(({p})=>p.name.toLowerCase().includes(q)&&(state.filter==='Semua'||state.filter==='Favorit'&&p.favorite||state.filter==='Barang curah'&&p.bulk)).map(({p,i})=>`<div class="list-row"><div><h3>${esc(p.name)}</h3><p>${p.bulk?'Curah':'Kemasan'} · Stok ${p.stock} ${esc(p.unit)}</p></div><div style="display:flex;align-items:center;gap:8px"><span>${money(p.price)}/${esc(p.unit)}</span><button class="button small light" data-add="${i}" aria-label="Tambah ${esc(p.name)}">＋</button></div></div>`).join('');}
  function cartHtml(){let entries=Object.entries(state.cart).filter(([,q])=>q>0);if(!entries.length)return '';return `<div class="card"><div class="row"><b>Keranjang · ${entries.length} produk</b><button class="icon" data-action="clear-cart">Kosongkan</button></div>${entries.map(([i,q])=>{let p=state.products[Number(i)];return `<div class="list-row"><div><h3>${esc(p.name)}</h3><p>${q} ${esc(p.unit)} × ${money(p.price)} = ${money(q*p.price)}</p></div><div class="qty"><button data-qty="${i}" data-delta="-1">−</button><span>${q}</span><button data-qty="${i}" data-delta="1">＋</button></div></div>`}).join('')}<div class="row" style="margin-top:12px"><span class="muted">Total belanja</span><b>${money(total())}</b></div></div>${btn(`Lanjut pembayaran · ${money(total())}`,'checkout')}`;}
  function cashier(){return `<section class="content"><div class="toolbar"><input class="input" id="search" placeholder="⌕  Cari nama / kode" value="${esc(state.search)}"><button class="button light small" data-action="scan">▥</button></div><div class="segmented three">${['Semua','Favorit','Barang curah'].map(x=>`<button class="${state.filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div>${productRows()}${cartHtml()}</section>`;}
  function stock(){let list=state.products.map((p,i)=>({p,i})).filter(({p})=>p.name.toLowerCase().includes(state.search.toLowerCase())&&(state.stockFilter==='Semua'||p.stock<=p.min));return `<section class="content"><div class="actions">${btn('+ Tambah produk','add-product','light')}${btn('Masuk / keluar','adjust-stock','light')}</div><label class="label">Cari produk</label><input class="input" id="search" placeholder="Nama produk / barcode" value="${esc(state.search)}"><div class="segmented two">${['Semua','Menipis'].map(v=>`<button class="${state.stockFilter===v?'active':''}" data-stock-filter="${v}">${v==='Semua'?`Semua (${state.products.length})`:'Menipis (2)'}</button>`).join('')}</div>${state.stockFilter==='Menipis'?info('2 produk mencapai batas minimum. Segera tambah stok Minyak goreng dan Mi instan.','⚠'):''}${list.map(({p,i})=>`<div class="list-row"><div><h3>${esc(p.name)}</h3><p>${money(p.price)}/${esc(p.unit)} · ${p.bulk?'Curah':'Kemasan'}${p.favorite?' · Favorit':''}</p></div><div style="text-align:right"><b>${p.stock} ${esc(p.unit)}</b><p>${p.stock<=p.min?'Menipis':'Cukup'}</p></div></div>`).join('')}<p class="muted">Stok berkurang otomatis setiap transaksi kasir.</p></section>`;}
  function debtRow(d,i){return `<button type="button" class="list-row debt-item" data-debt="${i??state.debts.indexOf(d)}"><span><h3>${esc(d.name)}</h3><p>${esc(d.phone)} · 24 Okt 2026</p></span><span style="text-align:right"><b>${money(d.balance)}</b><p>${esc(d.due)}</p></span></button>`;}
  function debts(){let items=state.debts.map((d,i)=>({d,i})).filter(({d})=>d.name.toLowerCase().includes(state.search.toLowerCase())&&(state.debtFilter!=='Lunas'&&d.balance>0||state.debtFilter==='Lunas'&&d.balance===0));let sum=state.debts.reduce((n,d)=>n+d.balance,0);return `<section class="content"><div class="card"><div>Total utang belum lunas</div><div class="metric">${money(sum)}</div><div class="row muted"><span>${state.debts.length} pelanggan</span><b style="color:#222">1 jatuh tempo hari ini</b></div></div><div class="actions">${btn('+ Catat utang','new-debt')}${btn('+ Pelanggan','new-customer','light')}</div><label class="label">Cari pelanggan</label><input class="input" id="search" placeholder="Nama / nomor HP" value="${esc(state.search)}"><div class="segmented three">${['Belum lunas','Jatuh tempo','Lunas'].map(v=>`<button class="${state.debtFilter===v?'active':''}" data-debt-filter="${v}">${v}</button>`).join('')}</div>${info('Bu Siti jatuh tempo hari ini. Buka detail pelanggan untuk mengirim pengingat.','♧')}${items.map(({d,i})=>debtRow(d,i)).join('')}</section>`;}
  function report(){return `<section class="content"><div class="segmented two"><button class="${state.period!=='Bulanan'?'active':''}" data-period="Harian">Harian</button><button class="${state.period==='Bulanan'?'active':''}" data-period="Bulanan">Bulanan</button></div><div class="card row"><span>‹</span><b>24 Oktober 2026</b><span>›</span></div><div class="card"><div class="row"><span class="muted">Penjualan hari ini</span><b>${money(state.sales)}</b></div><div class="row"><span class="muted">Modal barang terjual</span><span>−Rp378.000</span></div><div class="row"><span class="muted">Laba sederhana</span><b>Rp108.000</b></div><p class="muted">${state.transactions} transaksi · Tunai Rp401.000 · Utang Rp85.000</p></div><h2 class="title">Penjualan 6 hari terakhir</h2><div class="chart">${[55,82,65,95,70,110].map((h,i)=>`<div class="bar ${i===5?'today':''}" style="height:${h}px"><small>${['Sen','Sel','Rab','Kam','Jum','Sab'][i]}</small></div>`).join('')}</div><div style="height:26px"></div><div class="card"><h2 class="title">Bulan ini · Oktober 2026</h2><div class="row muted"><span>Penjualan · 286 transaksi</span><b>Rp12.450.000</b></div><div class="row muted"><span>Modal barang terjual</span><span>Rp9.730.000</span></div><div class="row"><span class="muted">Laba sederhana</span><b>Rp2.720.000</b></div></div><div class="card"><h2 class="title">Rekap utang bulan ini</h2><div class="row muted"><span>Utang tercatat</span><span>Rp1.250.000</span></div><div class="row muted"><span>Cicilan diterima</span><span>Rp925.000</span></div><div class="row"><span class="muted">Sisa utang</span><b>${money(state.debts.reduce((n,d)=>n+d.balance,0))}</b></div></div><small class="muted">Laba = penjualan dikurangi modal barang terjual, belum termasuk biaya toko.</small></section>`;}
  function settings(){return `<section class="content"><h2 class="title">Identitas toko</h2><label class="label">Nama toko</label><input class="input" value="Warung Adzqia"><label class="label">Alamat pada struk</label><input class="input" value="Kp. Lengis Warung Menteng">${btn('Simpan pengaturan toko','save-settings')}<h2 class="title" style="margin-top:22px">Akun pemilik</h2><div class="card">Pemilik <b style="float:right">Mariana</b><p>Nomor HP <b style="float:right">08xx xxxx xxxx</b></p>${btn('Ubah kata sandi','password','light')}</div><h2 class="title">Cadangan data</h2><div class="card">Cadangan terakhir · 23 Okt 2026 · 20.00<p class="muted">Termasuk produk, transaksi, stok, dan catatan utang pelanggan.</p>${btn('Cadangkan data sekarang','backup')}${btn('Pulihkan dari cadangan','restore','light')}</div>${info('Simpan salinan di tempat aman. Pemulihan akan mengganti data pada perangkat ini setelah konfirmasi.','▣')}${btn('Keluar dari akun','logout','light')}<p class="center muted">KULAKAN · Versi 1.0</p></section>`;}
  function checkout(){return `<section class="content"><p class="muted">${Object.keys(state.cart).length} jenis produk · Pelanggan umum</p><div class="card"><div>Total belanja</div><div class="metric">${money(total())}</div>${Object.entries(state.cart).map(([i,q])=>`<div class="row muted"><span>${esc(state.products[Number(i)].name)} · ${q} ${esc(state.products[Number(i)].unit)}</span><b style="color:#222">${money(state.products[Number(i)].price*q)}</b></div>`).join('')}</div><h2 class="title">Metode pembayaran</h2><div class="segmented two">${['Tunai','Catat utang'].map(v=>`<button class="${state.payment===v?'active':''}" data-payment="${v}">${v}</button>`).join('')}</div>${state.payment==='Tunai'?`<label class="label">Uang diterima</label><input id="cash" class="input" type="number" value="${state.cash}"><div class="actions">${['Uang pas','50000','100000'].map((v,i)=>btn(i===0?v:money(Number(v)),'cash-'+i,'light')).join('')}</div><div class="card row"><span class="muted">Kembalian</span><b>${money(Math.max(0,state.cash-total()))}</b></div>`:`<label class="label">Pilih pelanggan</label><select class="input" id="customer">${state.debts.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select><label class="label">Jatuh tempo</label><input class="input" type="date">`}${info('Setelah disimpan, transaksi masuk ke riwayat dan stok barang otomatis berkurang.')} ${btn('Selesaikan pembayaran','finish-payment')}<div style="margin-top:9px">${btn('Kembali ke keranjang','back-cashier','light')}</div></section>`;}
  function render(){if(state.screen==='login'){app.innerHTML=login();return;}let view=state.screen==='checkout'?checkout():state.tab==='home'?home():state.tab==='cashier'?cashier():state.tab==='stock'?stock():state.tab==='debts'?debts():state.tab==='report'?report():settings();app.innerHTML=`${status()}${state.screen==='checkout'?`<header class="top"><button class="icon" data-action="back-cashier">‹</button><div style="flex:1"><h1>Pembayaran</h1></div></header>`:state.tab==='settings'?`<header class="top"><button class="icon" data-action="back-home">‹</button><div style="flex:1"><h1>Pengaturan toko</h1><div class="sub">Kelola identitas, akun, dan cadangan</div></div></header>`:header()}${view}${state.screen==='checkout'?'':nav()}`;}
  function toast(message){let old=document.querySelector('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),2300);}
  function modal(title,fields,submit){let box=document.createElement('div');box.className='modal-back';box.innerHTML=`<form class="modal"><h2>${title}</h2>${fields}<div class="actions" style="margin-bottom:0"><button type="button" class="button light" data-cancel>Batal</button><button class="button">Simpan</button></div></form>`;document.body.append(box);box.querySelector('[data-cancel]').onclick=()=>box.remove();box.querySelector('[data-remind]')?.addEventListener('click',()=>{box.remove();toast('Pengingat siap dikirim.');});box.querySelector('form').onsubmit=e=>{e.preventDefault();submit(new FormData(e.currentTarget));box.remove();persist();render();};box.onclick=e=>{if(e.target===box)box.remove();};setTimeout(()=>box.querySelector('input')?.focus(),20);}
  function finish(){let sum=total();if(!sum)return;if(state.payment==='Tunai'&&state.cash<sum){toast('Uang diterima belum cukup.');return;}for(const [i,q]of Object.entries(state.cart))state.products[Number(i)].stock=Math.max(0,state.products[Number(i)].stock-q);if(state.payment==='Catat utang'){let d=state.debts.find(x=>x.name===(document.getElementById('customer')?.value||state.debts[0]?.name));if(d)d.balance+=sum;}state.sales+=sum;state.transactions++;state.cart={};state.tab='home';state.screen='app';persist();render();toast('Transaksi tersimpan. Terima kasih!');}
  app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next?.focus();next?.setSelectionRange(pos,pos);}if(e.target.id==='cash'){state.cash=Number(e.target.value)||0;render();document.getElementById('cash')?.focus();}});
  app.addEventListener('click',e=>{const b=e.target.closest('button,[data-tab],[data-add],[data-qty],[data-filter],[data-stock-filter],[data-debt-filter],[data-period],[data-payment],[data-debt]');if(!b)return;
    if(b.dataset.tab){state.tab=b.dataset.tab;state.screen='app';state.search='';}
    else if(b.dataset.add!==undefined){state.cart[b.dataset.add]=(state.cart[b.dataset.add]||0)+1;}
    else if(b.dataset.qty!==undefined){let i=b.dataset.qty;state.cart[i]=(state.cart[i]||0)+Number(b.dataset.delta);if(state.cart[i]<=0)delete state.cart[i];}
    else if(b.dataset.filter){state.filter=b.dataset.filter;}
    else if(b.dataset.stockFilter){state.stockFilter=b.dataset.stockFilter;}
    else if(b.dataset.debtFilter){state.debtFilter=b.dataset.debtFilter;}
    else if(b.dataset.period){state.period=b.dataset.period;}
    else if(b.dataset.payment){state.payment=b.dataset.payment;}
    else if(b.dataset.debt!==undefined){let d=state.debts[Number(b.dataset.debt)];modal(esc(d.name),`<p>Sisa utang <b>${money(d.balance)}</b></p><label class="label">Jumlah cicilan</label><input class="input" name="amount" type="number" required><button type="button" class="button light" style="margin-top:8px" data-remind>Kirim pengingat</button>`,f=>{d.balance=Math.max(0,d.balance-Number(f.get('amount')));});}
    else {let a=b.dataset.action;
      if(a==='login'){state.screen='app';state.tab='home';}
      else if(a==='goto-cashier'){state.tab='cashier';}
      else if(a==='settings'){state.tab='settings';}
      else if(a==='back-home'){state.tab='home';}
      else if(a==='back-cashier'){state.screen='app';state.tab='cashier';}
      else if(a==='checkout'){state.screen='checkout';state.payment='Tunai';}
      else if(a==='finish-payment'){finish();return;}
      else if(a==='clear-cart'){state.cart={};}
      else if(a==='cash-0'){state.cash=total();}
      else if(a==='cash-1'){state.cash=50000;}
      else if(a==='cash-2'){state.cash=100000;}
      else if(a==='scan'){modal('Scan barcode',`<label class="label">Nomor barcode</label><input class="input" name="code" value="8991001000034">`,()=>{state.cart[2]=(state.cart[2]||0)+1;toast('Minyak goreng ditambahkan ke keranjang.');});}
      else if(a==='add-product'){modal('Tambah produk',`<label class="label">Nama produk</label><input class="input" name="name" required><label class="label">Harga</label><input class="input" name="price" type="number" required><label class="label">Stok awal</label><input class="input" name="stock" type="number" value="0">`,f=>state.products.push({name:f.get('name'),price:Number(f.get('price')),unit:'pcs',stock:Number(f.get('stock')),min:5,bulk:false,favorite:false}));return;}
      else if(a==='adjust-stock'){modal('Stok masuk / keluar',`<label class="label">Produk</label><select class="input" name="product">${state.products.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select><label class="label">Jumlah</label><input class="input" name="amount" type="number" min="0.1" step="0.1" required><label class="label">Aksi</label><select class="input" name="mode"><option value="1">Stok masuk</option><option value="-1">Stok keluar</option></select>`,f=>{let p=state.products[Number(f.get('product'))];p.stock=Math.max(0,p.stock+Number(f.get('amount'))*Number(f.get('mode')));});return;}
      else if(a==='new-debt'||a==='new-customer'){modal(a==='new-debt'?'Catat utang':'Tambah pelanggan',`<label class="label">Nama pelanggan</label><input class="input" name="name" required><label class="label">Nomor HP</label><input class="input" name="phone"><label class="label">Jumlah utang</label><input class="input" name="balance" type="number" value="${a==='new-debt'?'0':''}">`,f=>state.debts.push({name:f.get('name'),phone:f.get('phone')||'-',balance:Number(f.get('balance'))||0,due:'Belum ditentukan'}));return;}
      else if(a==='installment'){let d=state.debts[0];modal(`Cicilan · ${esc(d.name)}`,`<label class="label">Jumlah diterima</label><input class="input" name="amount" type="number" required>`,f=>d.balance=Math.max(0,d.balance-Number(f.get('amount'))));return;}
      else if(a==='logout'){state.screen='login';}
      else if(a==='save-settings'||a==='backup'){toast('Berhasil disimpan di perangkat ini.');return;}
      else if(a){toast(({forgot:'Hubungi pemilik toko untuk memulihkan kata sandi.',register:'Pendaftaran toko siap dihubungkan.',password:'Fitur ubah kata sandi.',restore:'Tidak ada file cadangan dipilih.'})[a]||'');return;}
    }
    persist();render();
  });
  render();
})();
</script>
</body>
</html>
